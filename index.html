<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    You don't need to edit this file.
    All of your content (name, projects, links) lives in js/config.js.
  -->
  <title>Portfolio</title>
  <meta name="description" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Apply the saved light/dark choice before the page draws, so it doesn't flash -->
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="error-banner" id="config-error" role="alert" hidden></div>

  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="nav-home" id="nav-home" href="#top"></a>
      <ul class="nav-links" id="nav-links"></ul>
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
      </button>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-intro" id="hero-intro"></p>
      <ul class="hero-links" id="hero-links"></ul>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-heading" hidden>
      <h2 id="projects-heading">Projects</h2>
      <div class="project-grid" id="project-list"></div>
    </section>

    <section class="section" id="experience" aria-labelledby="experience-heading" hidden>
      <h2 id="experience-heading">Experience</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="section" id="gallery" aria-labelledby="gallery-heading" hidden>
      <h2 id="gallery-heading">Gallery</h2>
      <div class="gallery" id="gallery-list"></div>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-heading" hidden>
      <h2 id="contact-heading">Contact</h2>
      <p id="contact-note"></p>
      <p><a class="button" id="contact-button" href="#">Email me</a></p>
    </section>

    <noscript>
      <p class="noscript">This site needs JavaScript turned on to show its content.</p>
    </noscript>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lightbox-close" type="button" aria-label="Close photo">✕</button>
    <figure>
      <img id="lightbox-img" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
    <div class="lightbox-nav">
      <button type="button" id="lightbox-prev">Previous</button>
      <button type="button" id="lightbox-next">Next</button>
    </div>
  </dialog>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <!-- config.js must load before main.js -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/space.js"></script>
</body>
</html>
